# GitHub Actions workflow: verifies that every _('...') source string has
# a matching msgid in i18n/de.po and reports stale (dead) entries.
#
# Runs the reusable script tools/i18n_audit.sh in CI-mode (exit-code 1
# on missing or dead entries). Auf jedem Push + PR aktiv damit der
# 195er-Backlog (Stand 2026-05-30) nicht weiter waechst.
#
# Lokal vorab pruefen: `bash tools/i18n_audit.sh`

name: i18n Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run i18n audit
        run: |
          chmod +x tools/i18n_audit.sh
          bash tools/i18n_audit.sh

      # template.pot und die einkompilierte uLocalizationPo.inc muessen zu
      # Quelltext bzw. i18n/*.po passen (Review reDelphiX nach Bereichen
      # 2026-10-10, Nit 13).
      - name: template.pot und uLocalizationPo.inc aktuell
        run: |
          python3 tools/i18n_extract.py --check
          python3 tools/gen_po_inc.py --check

      # Ein abweichender Format-Platzhalter in einer Uebersetzung wirft zur
      # Laufzeit EConvertError (Birnen-/Kontextmenue) - fr.po deckt kein Test
      # ab, darum statisch pruefen (2026-10-15, reDelphix-Texte in SCA-Sprache).
      - name: Format-Platzhalter msgid/msgstr
        run: |
          python3 tools/po_placeholder_gate.py --selftest
          python3 tools/po_placeholder_gate.py

      - name: Show missing strings (on failure)
        if: failure()
        run: |
          echo "=== FEHLENDE de.po-Uebersetzungen ==="
          bash tools/i18n_audit.sh --missing || true
          echo ""
          echo "=== TOTE de.po-Eintraege ==="
          bash tools/i18n_audit.sh --dead || true
          echo ""
          echo "Backlog-Doku: Todo_I18nBacklog.md"
          echo "Lokales Skript: tools/i18n_audit.sh"
